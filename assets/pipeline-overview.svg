  <line x1="32" y1="52" x2="1068" y2="52" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="40" y="80" width="150" height="72" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="115" y="110" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Data</text>
  <text x="115" y="132" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Kaggle + ADNI</text>

  <rect x="230" y="80" width="150" height="72" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="305" y="110" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Preprocess</text>
  <text x="305" y="132" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">NIfTI to slices</text>

  <rect x="420" y="80" width="150" height="72" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="495" y="110" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Train</text>
  <text x="495" y="132" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">CNN / hybrid</text>

  <rect x="610" y="80" width="150" height="72" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="685" y="110" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Evaluate</text>
  <text x="685" y="132" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Acc, CM, F1</text>

  <rect x="800" y="80" width="150" height="72" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
  <text x="875" y="110" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="15" font-weight="600" text-anchor="middle">Explain</text>
  <text x="875" y="132" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">4+ XAI methods</text>

  <polygon points="190,116 200,112 200,120" fill="#64748b"/>
  <line x1="190" y1="116" x2="230" y2="116" stroke="#64748b" stroke-width="2"/>
  <polygon points="380,116 390,112 390,120" fill="#64748b"/>
  <line x1="380" y1="116" x2="420" y2="116" stroke="#64748b" stroke-width="2"/>
  <polygon points="570,116 580,112 580,120" fill="#64748b"/>
