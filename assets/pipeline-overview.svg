  <text x="870" y="254" fill="#bbf7d0" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Saliency</text>

  <rect x="40" y="320" width="1020" height="72" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="60" y="352" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Outputs</text>
  <text x="60" y="376" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Checkpoints, metrics CSV, confusion matrices, heatmaps, LIME panels, SHAP plots</text>
