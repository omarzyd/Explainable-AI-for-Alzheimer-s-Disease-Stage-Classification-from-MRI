  <text x="540" y="254" fill="#bfdbfe" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle">Integrated Grad.</text>
  <rect x="640" y="220" width="140" height="56" rx="8" fill="#172554" stroke="#34d399"/>
